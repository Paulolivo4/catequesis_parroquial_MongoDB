<!DOCTYPE html>
<html>
<head>
    <title>Editar Catequizado</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-warning">Editar Catequizado</h1>
        <form action="{{ url_for('main.actualizar_catequizado') }}" method="post" class="bg-white p-4 rounded shadow-sm">
            <input type="hidden" name="IdCatequizado" value="{{ catequizado['IdCatequizado'] }}">
            <div class="mb-3">
                <label for="Nombre_Catequizado" class="form-label">Nombre</label>
                <input type="text" class="form-control" name="Nombre_Catequizado" id="Nombre_Catequizado" value="{{ catequizado['Nombre_Catequizado'] }}" required>
            </div>
            <div class="mb-3">
                <label for="Apellido_Catequizado" class="form-label">Apellido</label>
                <input type="text" class="form-control" name="Apellido_Catequizado" id="Apellido_Catequizado" value="{{ catequizado['Apellido_Catequizado'] }}" required>
            </div>
            <div class="mb-3">
                <label for="FechaNacimiento_Catequizado" class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control" name="FechaNacimiento_Catequizado" id="FechaNacimiento_Catequizado" value="{{ catequizado['FechaNacimiento_Catequizado'] }}" required>
            </div>
            <div class="mb-3">
                <label for="Cedula_Catequizado" class="form-label">Cédula</label>
                <input type="text" class="form-control" name="Cedula_Catequizado" id="Cedula_Catequizado" value="{{ catequizado['Cedula_Catequizado'] }}" required>
            </div>
            <div class="mb-3">
                <label for="Direccion_Catequizado" class="form-label">Dirección</label>
                <input type="text" class="form-control" name="Direccion_Catequizado" id="Direccion_Catequizado" value="{{ catequizado['Direccion_Catequizado'] }}" required>
            </div>
            <div class="mb-3">
                <label for="Telefono_Catequizado" class="form-label">Teléfono</label>
                <input type="text" class="form-control" name="Telefono_Catequizado" id="Telefono_Catequizado" value="{{ catequizado['Telefono_Catequizado'] }}" required>
            </div>
            <div class="mb-3">
                <label for="Email_Catequizado" class="form-label">Email</label>
                <input type="email" class="form-control" name="Email_Catequizado" id="Email_Catequizado" value="{{ catequizado['Email_Catequizado'] }}" required>
            </div>
            <div class="mb-3">
                <label for="Parroquia_IdParroquia" class="form-label">ID Parroquia</label>
                <input type="number" class="form-control" name="Parroquia_IdParroquia" id="Parroquia_IdParroquia" value="{{ catequizado['Parroquia_IdParroquia'] }}" required>
            </div>
            <div class="mb-3">
                <label for="GrupoCatequizado_IdGrupoCatequizado" class="form-label">ID Grupo Catequizado</label>
                <input type="number" class="form-control" name="GrupoCatequizado_IdGrupoCatequizado" id="GrupoCatequizado_IdGrupoCatequizado" value="{{ catequizado['GrupoCatequizado_IdGrupoCatequizado'] }}" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Actualizar</button>
        </form>
        <a href="{{ url_for('main.index') }}" class="btn btn-link mt-3">Volver a la lista</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
