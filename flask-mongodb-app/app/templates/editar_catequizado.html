<!DOCTYPE html>
<html>
<head>
    <title>Editar Catequizado</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-warning">Editar Catequizado</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-3">
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <form action="{{ url_for('main.editar_catequizado') }}" method="post" class="bg-white p-4 rounded shadow-sm">
            <div class="mb-3">
                <label for="IdCatequizado" class="form-label">Selecciona el catequizado a editar:</label>
                <select name="IdCatequizado" id="IdCatequizado" class="form-select" required>
                    <option value="" disabled selected>Seleccione un catequizado</option>
                    {% for c in catequizados %}
                        <option value="{{ c['IdCatequizado'] }}">
                            {{ c['IdCatequizado'] }} - {{ c['Nombre_Catequizado'] }} {{ c['Apellido_Catequizado'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-warning w-100">Editar</button>
        </form>
        <a href="{{ url_for('main.index') }}" class="btn btn-link mt-3">Volver a la lista</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
